<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            font-family: 'Press Start 2P', cursive;
            color: white;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background-color: #000;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            border: 3px solid cyan;
        }
        
        canvas {
            background-color: #87CEEB; /* Sky Blue */
            display: block;
            border-radius: 10px;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            max-width: 100%;
            max-height: 80vh;
            aspect-ratio: 9 / 16;
        }

        #ui-container {
            margin-top: 15px;
        }

        #score {
            font-size: 2rem;
            font-weight: bold;
        }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5rem;
            display: none; /* Hidden by default */
            z-index: 10;
            border: 2px solid white;
        }

        #message-box h2 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: #FF4136; /* Red for Game Over */
        }
        
        #restart-button {
            padding: 15px 30px;
            font-size: 1rem;
            font-family: 'Press Start 2P', cursive;
            color: #000;
            background: linear-gradient(45deg, #7FDBFF, #0074D9);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px #001f3f;
            transition: all 0.1s ease;
        }

        #restart-button:active {
            transform: translateY(5px);
            box-shadow: 0 2px #001f3f;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-container">
            <div id="score">0</div>
        </div>
    </div>

    <div id="message-box">
        <h2 id="message-title">Game Over</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-button">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const messageBox = document.getElementById('message-box');
        const finalScoreEl = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');

        let bird, pipes, score, gravity, velocity, gameSpeed, gameState;
        let animationFrameId;

        // --- Game Configuration ---
        const BIRD_PROPS = {
            x: 50,
            y: 150,
            radius: 15,
            color: '#FFD700', // Gold
            jump: -7,
        };

        const PIPE_PROPS = {
            width: 50,
            gap: 180, // Gap between upper and lower pipe
            color: '#2E8B57', // SeaGreen
            interval: 120, // Frames between new pipes
        };

        // --- Utility Functions ---
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const aspectRatio = 9 / 16;
            let newWidth = container.clientWidth - 40; // Subtract padding
            let newHeight = newWidth / aspectRatio;

            if (newHeight > window.innerHeight * 0.8) {
                newHeight = window.innerHeight * 0.8;
                newWidth = newHeight * aspectRatio;
            }
            
            canvas.width = newWidth;
            canvas.height = newHeight;
        }

        // --- Game Object Drawing ---
        function drawBird() {
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = bird.color;
            ctx.fill();
            // Simple eye
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(bird.x + 5, bird.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPipes() {
            ctx.fillStyle = PIPE_PROPS.color;
            pipes.forEach(pipe => {
                // Draw upper pipe
                ctx.fillRect(pipe.x, 0, PIPE_PROPS.width, pipe.top);
                // Draw lower pipe
                ctx.fillRect(pipe.x, pipe.top + PIPE_PROPS.gap, PIPE_PROPS.width, canvas.height - (pipe.top + PIPE_PROPS.gap));
            });
        }

        // --- Game Logic ---
        function updateBird() {
            velocity += gravity;
            bird.y += velocity;

            // Prevent bird from going above the canvas
            if (bird.y - bird.radius < 0) {
                bird.y = bird.radius;
                velocity = 0;
            }

            // Check for collision with bottom of canvas
            if (bird.y + bird.radius > canvas.height) {
                gameOver();
            }
        }

        function updatePipes() {
            // Add new pipe
            if (animationFrameId % PIPE_PROPS.interval === 0) {
                const topPipeHeight = Math.random() * (canvas.height - PIPE_PROPS.gap - 100) + 50;
                pipes.push({ x: canvas.width, top: topPipeHeight });
            }

            // Move pipes to the left
            pipes.forEach(pipe => {
                pipe.x -= gameSpeed;
            });

            // Remove pipes that are off-screen
            pipes = pipes.filter(pipe => pipe.x + PIPE_PROPS.width > 0);
        }
        
        function checkCollisions() {
            // Pipe collision
            for (const pipe of pipes) {
                if (
                    bird.x + bird.radius > pipe.x &&
                    bird.x - bird.radius < pipe.x + PIPE_PROPS.width &&
                    (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.top + PIPE_PROPS.gap)
                ) {
                    gameOver();
                    return;
                }
            }
        }

        function updateScore() {
            pipes.forEach(pipe => {
                if (pipe.x + PIPE_PROPS.width < bird.x && !pipe.passed) {
                    score++;
                    pipe.passed = true;
                    scoreEl.textContent = score;
                }
            });
        }

        function birdFlap() {
            if (gameState !== 'playing') return;
            velocity = BIRD_PROPS.jump;
        }

        // --- Game State Management ---
        function setup() {
            resizeCanvas();
            bird = { ...BIRD_PROPS, y: canvas.height / 2 };
            pipes = [];
            score = 0;
            gravity = 0.4;
            velocity = 0;
            gameSpeed = 3;
            gameState = 'start';
            scoreEl.textContent = '0';
            messageBox.style.display = 'none';
            drawInitialScreen();
        }

        function startGame() {
            if (gameState === 'playing') return;
            if (gameState === 'gameOver') {
                setup();
            }
            gameState = 'playing';
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            gameLoop();
        }

        function gameOver() {
            if (gameState === 'gameOver') return;
            gameState = 'gameOver';
            cancelAnimationFrame(animationFrameId);
            finalScoreEl.textContent = score;
            messageBox.style.display = 'block';
        }

        function drawInitialScreen() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBird();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = `${canvas.width / 15}px 'Press Start 2P'`;
            ctx.fillText('Flappy Bird', canvas.width / 2, canvas.height / 3);
            ctx.font = `${canvas.width / 25}px 'Press Start 2P'`;
            ctx.fillText('Click or Press Space', canvas.width / 2, canvas.height / 2);
            ctx.fillText('to Start', canvas.width / 2, canvas.height / 2 + 40);
        }

        // --- Main Game Loop ---
        function gameLoop() {
            if (gameState !== 'playing') return;

            // Update game objects
            updateBird();
            updatePipes();
            checkCollisions();
            updateScore();

            // Clear canvas and redraw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPipes();
            drawBird();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
             // If game is over or not started, just redraw the screen.
            if (gameState !== 'playing') {
                setup();
            } else {
                // If playing, might need more complex logic to adjust game elements
                // For simplicity, we'll just end the game on resize during play
                gameOver();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameState === 'playing') {
                    birdFlap();
                } else {
                    startGame();
                }
            }
        });

        canvas.addEventListener('mousedown', () => {
            if (gameState === 'playing') {
                birdFlap();
            } else {
                startGame();
            }
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent screen scrolling
             if (gameState === 'playing') {
                birdFlap();
            } else {
                startGame();
            }
        }, { passive: false });

        restartButton.addEventListener('click', () => {
            messageBox.style.display = 'none';
            setup();
            startGame();
        });

        // --- Initial Setup Call ---
        window.onload = setup;

    </script>
</body>
</html>
